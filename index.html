<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Ryvra — Coming Soon</title>
  <meta name="description" content="Ryvra is currently under construction. Something new is taking shape.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Soft top glow */
    body::before {
      content: "";
      position: absolute;
      top: -40%;
      left: 50%;
      transform: translateX(-50%);
      width: 120%;
      height: 70%;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .brand {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #a1a1aa;
      margin-bottom: 64px;
      opacity: 0;
      animation: fadeIn 0.9s ease 0.1s forwards;
    }

    h1 {
      font-size: clamp(2.4rem, 6.5vw, 3.4rem);
      font-weight: 600;
      line-height: 1.15;
      letter-spacing: -0.04em;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 0.9s ease 0.25s forwards;
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #a1a1aa;
      font-weight: 400;
      max-width: 360px;
      margin: 0 auto;
      opacity: 0;
      animation: fadeIn 0.9s ease 0.4s forwards;
    }

    .footer {
      margin-top: 88px;
      font-size: 12px;
      color: #52525b;
      letter-spacing: 0.01em;
      opacity: 0;
      animation: fadeIn 0.9s ease 0.55s forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .brand {
        margin-bottom: 48px;
      }
      .footer {
        margin-top: 72px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">Ryvra</div>
    <h1>Something new is taking shape.</h1>
    <p>We’re building Ryvra.<br>The journey starts here.</p>
    <div class="footer">© 2026 Ryvra</div>
  </div>
</body>
</html>
