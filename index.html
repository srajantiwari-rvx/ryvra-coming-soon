
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>Ryvra — Coming Soon</title>
  <meta name="description" content="Ryvra is in the making. Our journey starts here.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #0b0b0b;
      color: #f5f5f5;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    main { max-width: 520px; }
    .brand {
      letter-spacing: .28em;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 64px;

      letter-spacing: -.04em;
      margin: 0 0 20px;
    }
    p {
      color: #a3a3a3;
      line-height: 1.7;

    }
    footer {

      color: #737373;

  <main>
    <div class="brand">RYVRA</div>
    <h1>Something new is taking shape.</h1>
